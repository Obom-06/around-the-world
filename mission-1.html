<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mission 1 – Listening</title>
<style>
:root{
  --ink:#243047; --blue:#2456a0; --navy:#244b80; --sky:#f0f6ff;
  --line:#d8e2f0; --good-bg:#d8f5df; --good:#319b55; --bad-bg:#ffe1e1; --bad:#d65a5a;
  --gold:#e3a32a; --card:#fff; --max:1000px;
}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:var(--sky);line-height:1.5}
.site-nav{background:var(--navy);color:#fff}
.site-nav .inner{max-width:var(--max);margin:auto;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.site-nav a{color:#fff;text-decoration:none;font-weight:bold}
.site-nav a:hover{text-decoration:underline}
main{max-width:var(--max);margin:auto;padding:22px 18px 48px}
h1,h2{color:var(--navy);text-align:center}
.card{background:var(--card);padding:16px;border-radius:12px;margin:14px 0}
.intro{text-align:center}
.intro p{margin:6px 0}
.btn{display:inline-block;border:0;border-radius:10px;padding:13px 20px;background:var(--blue);color:#fff;font-weight:bold;font-size:15px;cursor:pointer;text-decoration:none}
.btn:hover{background:#1c4585}
.btn.secondary{background:#fff;color:var(--blue);border:2px solid var(--blue)}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

/* Audio */
.audio-box{text-align:center}
.audio-box audio{width:100%;margin:8px 0}

/* Progress */
.progress{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 2px}
.progress>div{height:100%;width:0;background:var(--good);transition:width .3s}
.progress-label{font-size:13px;text-align:right}

/* Quiz */
.option{display:block;width:100%;text-align:left;padding:12px;margin:7px 0;border:2px solid var(--line);border-radius:9px;background:#fff;cursor:pointer;font-size:15px;color:var(--ink)}
.option:hover:not(:disabled){background:#eaf2ff}
.option:disabled{cursor:default}
.option.correct{background:var(--good-bg);border-color:var(--good)}
.option.wrong{background:var(--bad-bg);border-color:var(--bad)}
.feedback{font-size:14px;margin-top:8px;min-height:1.2em}
.feedback.ok{color:#19743b}.feedback.no{color:#a52b2b}
.result{text-align:center}
.result .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* Home */
.missions{list-style:none;padding:0;margin:0}
.mission{display:flex;justify-content:space-between;align-items:center;gap:12px}
.mission h3{margin:0;color:var(--navy)}
.mission p{margin:2px 0 0;font-size:14px}
.mission.locked{opacity:.6}
.badge{font-size:13px;font-weight:bold;color:#19743b}

/* ---------- Home page ---------- */
.home main{max-width:760px;padding-top:34px}
.home h1{font-family:"Trebuchet MS",Verdana,sans-serif;font-size:clamp(30px,6vw,46px);line-height:1.1;margin:0 0 12px}
.home .lead{text-align:center;font-size:18px;max-width:560px;margin:0 auto 28px}

.pass{display:grid;grid-template-columns:1fr 200px;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 6px 0 var(--line)}
.pass-main{padding:22px 24px}
.pass-head{display:flex;justify-content:space-between;align-items:baseline;font-weight:bold;color:var(--navy);border-bottom:2px dashed var(--line);padding-bottom:10px;margin-bottom:6px}
.pass-head span:last-child{font-weight:normal;font-size:14px}

.route{list-style:none;margin:0;padding:0}
.route li{display:grid;grid-template-columns:62px 1fr;align-items:center;gap:12px;padding:11px 0}
.route li+li{border-top:1px solid var(--line)}
.route .code{font-family:"Courier New",monospace;font-size:22px;font-weight:bold;color:var(--blue);letter-spacing:1px}
.route .what{font-weight:bold}
.route .what small{display:block;font-weight:normal;font-size:14px;color:#52607a}

.pass-stub{background:var(--navy);color:#fff;padding:22px 18px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:12px;border-left:3px dashed var(--sky)}
.pass-stub p{margin:0;font-size:14px}
.btn.go{background:var(--gold);color:#243047;font-size:17px;padding:15px 18px;width:100%}
.btn.go:hover{background:#f0b63e}
.pass-stub :focus-visible{outline-color:#fff}

.tips{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:22px}
.tips .card{margin:0;text-align:center;font-size:15px}
.tips b{display:block;color:var(--navy);margin-bottom:4px}

@media (max-width:620px){
  .pass{grid-template-columns:1fr}
  .pass-stub{border-left:0;border-top:3px dashed var(--sky)}
  .tips{grid-template-columns:1fr}
}

.map-hero{margin:0 0 24px}
.map-hero img{display:block;width:100%;height:auto;border-radius:18px;box-shadow:0 6px 0 var(--line)}

.stub-form{width:100%;display:flex;flex-direction:column;gap:8px;text-align:left}
.stub-form label{font-weight:bold;font-size:15px}
.stub-form input{width:100%;padding:12px;border:0;border-radius:9px;font-size:16px;font-family:inherit;color:var(--ink)}
.stub-form input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.stub-form .btn{margin-top:4px}
.greet{font-size:18px}

/* ---------- Mission Control ---------- */
.passport-cover{background:var(--navy);color:#fff;border-radius:18px;padding:20px 22px;margin-bottom:18px;box-shadow:0 6px 0 #1a3a66}
.passport-cover small{letter-spacing:2px;font-size:12px;opacity:.85}
.passport-cover h1{color:#fff;text-align:left;margin:4px 0 12px;font-size:clamp(24px,5vw,32px);font-family:"Trebuchet MS",Verdana,sans-serif}
.passport-cover .progress{background:rgba(255,255,255,.25)}
.passport-cover .progress>div{background:var(--gold)}
.passport-cover .progress-label{color:#fff;text-align:left}

.stops{display:grid;grid-template-columns:1fr 1fr;gap:14px;list-style:none;padding:0;margin:0}
.stop{background:#fff;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px;box-shadow:0 4px 0 var(--line);border:3px solid transparent}
.stop.next{border-color:var(--gold)}
.stop h3{margin:0;color:var(--navy);font-size:18px}
.stop .skill{font-size:13px;font-weight:bold;color:#52607a;text-transform:uppercase;letter-spacing:1px}
.stop .goal{margin:0;font-size:15px;flex:1}
.stop .btn{text-align:center;padding:11px 14px}
.stop .btn[aria-disabled="true"]{background:#c9d3e3;color:#52607a;cursor:default;pointer-events:none}

.stamp{width:92px;height:92px;border-radius:50%;margin:0 auto 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  border:4px dashed #c3cde0;color:#b2bdd2;font-family:"Courier New",monospace;font-weight:bold;transform:rotate(-8deg)}
.stamp .code{font-size:22px;letter-spacing:1px}
.stamp .tag{font-size:11px;letter-spacing:1px}
.stamp.earned{border:4px double var(--c);color:var(--c);background:rgba(255,255,255,.9);box-shadow:inset 0 0 0 3px #fff, inset 0 0 0 5px var(--c)}
.stop:nth-child(even) .stamp{transform:rotate(7deg)}
.goal-label{font-size:12px;font-weight:bold;color:var(--blue);margin-bottom:-4px}

@media (max-width:560px){.stops{grid-template-columns:1fr}}

/* ---------- Mission 2 (Speaking) ---------- */
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
.chip{border:2px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:11px 16px;font-size:15px;cursor:pointer}
.chip:hover{background:#eaf2ff}
.chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:bold}
.info{background:#eaf2ff;border-radius:9px;padding:12px;margin-top:10px}
.tip{background:#eaf2ff;border-radius:9px;padding:12px}
.tip ul{margin:6px 0 0;padding-left:20px}
.notes{width:100%;min-height:110px;padding:12px;border:2px solid var(--line);border-radius:9px;font:inherit;font-size:16px;color:var(--ink);resize:vertical}
.counter{font-size:13px;color:#52607a;margin-top:4px}
.counter.good{color:#19743b;font-weight:bold}
.question-box{background:#fff8e6;border:2px solid var(--gold);border-radius:9px;padding:14px;margin-top:10px;font-weight:bold;text-align:center}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;cursor:pointer}
.check input{width:22px;height:22px;margin:0;flex:none}

.hero-img{margin:0 0 16px}
.hero-img img{display:block;width:100%;height:auto;border-radius:18px;box-shadow:0 6px 0 var(--line)}
.steps{padding-left:22px;margin:8px 0 12px}
.steps li{margin:6px 0}

/* ---------- Mission 3 (Reading) ---------- */
.postcard{background:#fff8e8;border:2px dashed #d9ad62;border-radius:12px;padding:20px;line-height:1.7}
.postcard p{margin:0 0 12px}
.postcard .sign{margin:0;font-weight:bold}

/* ---------- Mission 4 (Writing) ---------- */
.field{display:block;margin:14px 0;font-weight:bold}
.field input{display:block;width:100%;margin-top:6px;padding:12px;border:2px solid var(--line);border-radius:9px;font:inherit;font-size:16px;font-weight:normal;color:var(--ink)}
.field input:focus-visible,.notes:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.notes.tall{min-height:170px}
.msg{font-size:14px;min-height:1.2em;margin:6px 0 0}

/* ---------- Achievement Room ---------- */
.stamp-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;list-style:none;padding:0;margin:0}
.stamp-row li{text-align:center;font-size:14px}
.stamp-row .stamp{width:84px;height:84px}
.stamp-row .name{font-weight:bold;margin-top:6px}
.stamp-row .sub{font-size:12px;color:#52607a}
.certificate{background:#fffdf5;border-radius:18px;padding:10px;box-shadow:0 6px 0 var(--line)}
.cert-border{border:4px double var(--gold);border-radius:12px;padding:24px 18px;text-align:center}
.cert-border small{letter-spacing:3px;color:#8a6410;font-weight:bold}
.cert-border h2{margin:10px 0;font-family:"Trebuchet MS",Verdana,sans-serif;font-size:clamp(26px,6vw,36px)}
.cert-list{list-style:none;padding:0;margin:12px 0;line-height:1.9;font-weight:bold;color:var(--navy)}
.legend{font-weight:bold;margin:16px 0 4px}
fieldset{border:0;padding:0;margin:0 0 6px}
.locked{text-align:center}
.btn.disabled{background:#c9d3e3;color:#52607a;pointer-events:none}
.ach-link{text-align:center}
@media (max-width:560px){.stamp-row{grid-template-columns:1fr 1fr}.stamp-row .stamp{width:92px;height:92px}}
@media print{
  .site-nav,.no-print{display:none !important}
  body{background:#fff}
  body.printing main>:not(#cert-wrap){display:none !important}
}

/* ---------- Teacher's Corner ---------- */
.t-list{list-style:none;padding:0;margin:8px 0 0}
.t-list li{display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.t-list li:first-child{border-top:0}
.t-list .who{font-weight:bold;color:var(--navy)}
.t-list .who small{display:block;font-weight:normal;color:#52607a}
.code-badge{display:inline-block;background:var(--blue);color:#fff;border-radius:8px;padding:2px 8px;font-family:"Courier New",monospace;font-weight:bold;margin-right:6px}
.total{margin-top:8px;padding:10px 12px;background:#eaf2ff;border-radius:9px;font-weight:bold}
.t-steps{padding-left:22px;margin:8px 0}
.t-steps li{margin:6px 0}
details{margin:8px 0}
summary{cursor:pointer;font-weight:bold;color:var(--blue);padding:6px 0}
.key{margin:6px 0 6px 18px;padding:0}
.btn.danger{background:#c0392b}
.btn.danger:hover{background:#a53125}
.foot{text-align:center;margin-top:26px;font-size:14px}
.foot a{color:var(--blue)}
@media (max-width:560px){.t-list li{grid-template-columns:1fr;gap:2px}}

:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.view[hidden]{display:none}
html,body{min-height:100%}
body{min-height:100vh;width:100%}
.view{min-height:100vh}

</style>

</head>

<script>
(function(){
  function url(k){return (k in PAGE_SLUGS)?SITE_BASE+PAGE_SLUGS[k]+SITE_EXT:null;}
  function fix(a){var h=a.getAttribute("href");if(!h||h.charAt(0)!=="#"||h.length<2)return;var u=url(h.slice(1));if(u){a.setAttribute("href",u);a.setAttribute("target","_top");}}
  window.goTo=function(k){var u=url(k);if(u)window.open(u,"_top");};
  document.querySelectorAll('a[href^="#"]').forEach(fix);
  document.addEventListener("click",function(e){var a=e.target.closest&&e.target.closest("a");if(a)fix(a);},true);
})();
</script>
<script>
(function(){
  const questions = [
    {q:"1. Where is Japan located?", a:["East Asia","South America","Europe"], c:0, why:"Japan is located in East Asia."},
    {q:"2. What is the capital city of Japan?", a:["Osaka","Tokyo","Kyoto"], c:1, why:"Tokyo is the capital city of Japan."},
    {q:"3. What is the famous mountain mentioned?", a:["Mount Everest","Mount Kinabalu","Mount Fuji"], c:2, why:"The travel agent mentions Mount Fuji."},
    {q:"4. What do people enjoy looking at in spring?", a:["Cherry blossoms","Snowmen","Palm trees"], c:0, why:"People enjoy looking at cherry blossoms."},
    {q:"5. Which Japanese food is mentioned?", a:["Pizza and pasta","Sushi and ramen","Burgers and fries"], c:1, why:"The recording mentions sushi and ramen."}
  ];

  const root = document.getElementById("questions");
  const result = document.getElementById("result");
  const bar = document.getElementById("bar-m1");
  const barWrap = document.getElementById("bar-wrap-m1");
  const barLabel = document.getElementById("bar-label-m1");
  const player = document.getElementById("player");
  let score = 0, answered = 0;

  let studentName = "";
  try{ studentName = localStorage.getItem("japanName") || ""; }catch(e){}
  if(studentName){
    const g = document.getElementById("greet");
    g.textContent = "Welcome aboard, "+studentName+"! ✈";
    g.hidden = false;
  }

  document.getElementById("listen-again").addEventListener("click", () => {
    player.currentTime = 0;
    player.play().catch(()=>{});
  });

  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
  }

  function updateProgress(){
    bar.style.width = (answered/questions.length*100)+"%";
    barWrap.setAttribute("aria-valuenow", answered);
    barLabel.textContent = answered+" / "+questions.length+" answered";
  }

  function build(){
    score = 0; answered = 0;
    root.innerHTML = ""; result.innerHTML = "";
    updateProgress();

    questions.forEach(item => {
      const card = document.createElement("div");
      card.className = "card";
      const heading = document.createElement("b");
      heading.textContent = item.q;
      card.appendChild(heading);

      const feedback = document.createElement("div");
      feedback.className = "feedback";
      feedback.setAttribute("aria-live","polite");

      // Shuffle the answers but remember which one is correct
      const options = shuffle(item.a.map((text,i)=>({text, correct:i===item.c})));
      const buttons = [];

      options.forEach((opt,i) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "option";
        btn.textContent = String.fromCharCode(65+i)+". "+opt.text;
        btn.addEventListener("click", () => {
          answered++;
          if(opt.correct){
            score++;
            btn.classList.add("correct");
            feedback.textContent = "✓ Correct! "+item.why;
            feedback.className = "feedback ok";
          } else {
            btn.classList.add("wrong");
            feedback.textContent = "Not quite. "+item.why;
            feedback.className = "feedback no";
            buttons[options.findIndex(o=>o.correct)].classList.add("correct");
          }
          buttons.forEach(b => b.disabled = true);
          updateProgress();
          if(answered === questions.length) showResult();
        });
        buttons.push(btn);
        card.appendChild(btn);
      });

      card.appendChild(feedback);
      root.appendChild(card);
    });
  }

  function showResult(){
    const message = score===5 ? "Excellent! You are a Japan Explorer! 🏆"
      : score>=3 ? "Good effort! Keep practising! 🌟"
      : "Keep learning! Listen again and try once more! 💪";

    try{
      const saved = JSON.parse(localStorage.getItem("japanMissions")||"{}");
      if(saved["1"]===undefined || score>saved["1"]) saved["1"] = score;
      localStorage.setItem("japanMissions", JSON.stringify(saved));
    }catch(e){}

    result.innerHTML =
      '<div class="card result"><h3 id="done-title">Mission completed!</h3>'+
      '<h2>'+score+' / '+questions.length+'</h2>'+
      '<p>'+message+'</p>'+
      '<div class="actions">'+
      '<button type="button" class="btn secondary" id="retry">Try Again</button>'+
      '<a class="btn" href="#mission-control">Back to Mission Control</a>'+
      '</div></div>';

    if(studentName){
      document.getElementById("done-title").textContent = "Mission completed, "+studentName+"!";
    }
    document.getElementById("retry").addEventListener("click", () => {
      build();
      window.scrollTo({top:0, behavior:"smooth"});
    });
    result.scrollIntoView({behavior:"smooth", block:"center"});
  }

  build();
})();
</script>
